<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>panel.cypek.dev</title>
    <meta name="theme-color" content="#050506" />
    <script>
      // Apply the stored theme before React mounts to avoid a flash. Dark is the default.
      try {
        var t = localStorage.getItem("homepanel-theme");
        if (t === "light" || (t === "system" && window.matchMedia("(prefers-color-scheme: light)").matches)) {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
