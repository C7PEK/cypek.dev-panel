id: fivem-txadmin
name: FiveM z txAdmin
category: fivem
group: fxserver
order: 20
icon: fivem
description:
  pl: FXServer uruchamiany przez txAdmin, czyli własny panel FiveM na porcie 40120 (konfiguracja, zasoby, bany). Do przepisów ESX/QBCore najpierw utwórz bazę w zakładce Bazy danych panelu i wpisz jej użytkownika, hasło i nazwę w kreatorze txAdmin (host 127.0.0.1). UWAGA, txAdmin ma własny harmonogram restartów, który dubluje harmonogram tego panelu; włącz tylko jeden. Przy pierwszym starcie PIN logowania pojawi się w konsoli. Tylko hosty x86_64.
  en: FXServer started through txAdmin, FiveM's own web panel on port 40120 (setup, resources, bans). For ESX/QBCore recipes create a database in the panel's Databases tab first and enter its user, password and name in the txAdmin deployer (host 127.0.0.1). NOTE, txAdmin has its own restart scheduler that duplicates this panel's; enable only one. The first-login PIN shows up in the console. x86_64 hosts only.
  de: FXServer, gestartet über txAdmin, das eigene Webpanel von FiveM auf Port 40120 (Einrichtung, Ressourcen, Bans). Für ESX/QBCore-Rezepte erstellst du zuerst im Tab Datenbanken des Panels eine Datenbank und trägst Benutzer, Passwort und Name im txAdmin-Deployer ein (Host 127.0.0.1). WICHTIG, txAdmin hat einen eigenen Neustart-Planer, der den des Panels doppelt. Aktiviere nur einen. Die PIN für die erste Anmeldung erscheint in der Konsole. Nur für x86_64-Hosts.

variables:
  - key: LICENSE_KEY
    label: { pl: Klucz licencyjny (sv_licenseKey), en: License key (sv_licenseKey), de: Lizenzschlüssel (sv_licenseKey) }
    help:
      pl: Z https://keymaster.fivem.net. Trafia do server.cfg w katalogu serwera, który wskażesz w kreatorze txAdmin.
      en: From https://keymaster.fivem.net. Written to server.cfg in the server folder you point txAdmin at.
      de: Von https://keymaster.fivem.net. Wird in die server.cfg in dem Serverordner geschrieben, den du in txAdmin angibst.
    type: secret
    required: true
    pattern: '^[A-Za-z0-9_-]{20,128}$'
  - key: SERVER_NAME
    label: { pl: Nazwa serwera (sv_hostname), en: Server name (sv_hostname), de: Servername (sv_hostname) }
    type: string
    default: My FiveM Server
    maxLength: 120
  - key: MAX_CLIENTS
    label: { pl: Maksymalna liczba graczy, en: Max players, de: Max. Spieler }
    type: number
    default: 32
    min: 1
    max: 2048
  - key: PORT
    label: { pl: Port gry (TCP+UDP), en: Game port (TCP+UDP), de: Spielport (TCP+UDP) }
    type: number
    default: 30120
    min: 1024
    max: 65535
  - key: TX_PORT
    label: { pl: Port txAdmin (TCP), en: txAdmin port (TCP), de: txAdmin-Port (TCP) }
    help:
      pl: Panel txAdmin będzie pod http://IP-maszyny:PORT. Nie wystawiaj go bez HTTPS do internetu.
      en: txAdmin will be at http://machine-ip:PORT. Do not expose it to the internet without HTTPS.
      de: txAdmin ist dann unter http://rechner-ip:PORT erreichbar. Gib es nicht ohne HTTPS ins Internet frei.
    type: number
    default: 40120
    min: 1024
    max: 65535
  - key: ARTIFACT
    label: { pl: Wersja FXServer (artefakt), en: FXServer version (artifact), de: FXServer-Version (Artifact) }
    type: select
    source: fivem-artifacts
    default: recommended

runtime:
  kind: none

install:
  - download:
      provider: fivem
      version: "{{ARTIFACT}}"
      to: fx.tar.xz
  - extract:
      from: fx.tar.xz
      to: artifact
  - download:
      provider: url
      url: https://codeload.github.com/citizenfx/cfx-server-data/zip/refs/heads/master
      to: server-data.zip
  - extract:
      from: server-data.zip
      to: "."
      strip: 1
  - write:
      path: server.cfg
      content: |
        # Generated by panel.cypek.dev. In the txAdmin setup wizard choose
        # "existing server data" and point it at this folder.
        endpoint_add_tcp "0.0.0.0:{{PORT}}"
        endpoint_add_udp "0.0.0.0:{{PORT}}"

        ensure mapmanager
        ensure chat
        ensure spawnmanager
        ensure sessionmanager
        ensure basic-gamemode
        ensure hardcap
        ensure fivem-map-skater

        sv_scriptHookAllowed 0
        sv_hostname "{{SERVER_NAME}}"
        sets sv_projectName "{{SERVER_NAME}}"
        sets sv_projectDesc "Hosted with panel.cypek.dev"
        sets tags "default"
        sv_maxclients {{MAX_CLIENTS}}
        sv_endpointprivacy true

        sv_licenseKey "{{LICENSE_KEY}}"

start:
  command: artifact/run.sh
  args: ["+set", "serverProfile", "default", "+set", "txAdminPort", "{{TX_PORT}}", "+set", "txDataPath", "txData"]
stop:
  command: "^C"
  timeoutSec: 90
readyRegex: ""

ports:
  - { name: game, port: "{{PORT}}", protocol: tcp+udp }
  - { name: txadmin, port: "{{TX_PORT}}", protocol: tcp }

query: { kind: fivem-http, port: "{{PORT}}" }

configDefaults:
  - files: ["server.cfg", "txData/*/server.cfg"]
    key: mysql_slow_query_warning
    line: "set mysql_slow_query_warning 1500"

console:
  commands:
    - { name: status, help: { pl: Lista graczy z ID i pingiem, en: Player list with ids and ping, de: Spielerliste mit IDs und Ping } }
    - { name: ensure, args: "<resource>", help: { pl: Uruchom lub zrestartuj zasób, en: Start or restart a resource, de: Ressource starten oder neu starten } }
    - { name: restart, args: "<resource>", help: { pl: Zrestartuj zasób, en: Restart a resource, de: Ressource neu starten } }
    - { name: refresh, help: { pl: Przeskanuj folder resources, en: Rescan the resources folder, de: Ressourcen-Ordner neu einlesen } }
    - { name: txaKickAll, args: "[reason...]", help: { pl: Wyrzuć wszystkich graczy (txAdmin), en: Kick everyone (txAdmin), de: Alle kicken (txAdmin) } }
    - { name: txaBroadcast, args: "<message...>", help: { pl: Ogłoszenie do wszystkich (txAdmin), en: Broadcast to everyone (txAdmin), de: Nachricht an alle (txAdmin) } }
    - { name: quit, help: { pl: Zatrzymaj serwer, en: Stop the server, de: Server stoppen } }
