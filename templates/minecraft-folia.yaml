id: minecraft-folia
name: Minecraft (Folia)
category: minecraft
group: plugins
order: 30
icon: minecraft
description:
  pl: Wielowątkowa odmiana Paper od PaperMC dla dużych serwerów (wiele rdzeni CPU, dużo graczy). Działa tylko z pluginami oznaczonymi jako zgodne z Folią.
  en: PaperMC's multithreaded fork of Paper for big servers (many CPU cores, many players). Only plugins marked as Folia-compatible work.

variables:
  - key: MC_VERSION
    label: { pl: Wersja Minecrafta, en: Minecraft version }
    help:
      pl: Najnowsza stabilna wersja jest zwykle najlepszym wyborem. Wersje pre i rc to wersje testowe.
      en: The latest stable version is usually the best choice. pre and rc versions are test builds.
    type: select
    source: folia-versions
    default: latest
  - key: RAM_MB
    label: { pl: Pamięć RAM (MB), en: Memory (MB) }
    help:
      pl: Ile pamięci dostaje Java (Xmx). 2048 wystarcza na kilku graczy, 4096+ dla większych światów i pluginów.
      en: How much memory Java gets (Xmx). 2048 is fine for a few players, 4096+ for bigger worlds and plugins.
    type: number
    default: 2048
    min: 512
    max: 262144
  - key: PORT
    label: { pl: Port gry, en: Game port }
    help:
      pl: Domyślnie 25565. Zmień, gdy masz kilka serwerów Minecraft na jednej maszynie.
      en: Default 25565. Change it when you run several Minecraft servers on one machine.
    type: number
    default: 25565
    min: 1024
    max: 65535
  - key: MOTD
    label: { pl: Opis serwera (MOTD), en: Server description (MOTD) }
    type: string
    default: A Minecraft Server
    maxLength: 59
  - key: EULA
    label:
      pl: Akceptuję warunki Minecraft EULA (https://aka.ms/MinecraftEULA)
      en: I accept the Minecraft EULA (https://aka.ms/MinecraftEULA)
    help:
      pl: Mojang wymaga akceptacji, żeby serwer wystartował. Panel nie akceptuje jej za Ciebie.
      en: Mojang requires it before the server starts. The panel does not accept it on your behalf.
    type: bool
    default: false
    consent: true

runtime:
  kind: java
  version: auto

install:
  - download:
      provider: folia
      version: "{{MC_VERSION}}"
      to: server.jar
  - write:
      path: eula.txt
      content: "eula=true\n"
      requireConsent: EULA
  - properties:
      path: server.properties
      set:
        server-port: "{{PORT}}"
        query.port: "{{PORT}}"
        motd: "{{MOTD}}"

start:
  command: "{{JAVA}}"
  args:
    - "-Xms{{RAM_MB}}M"
    - "-Xmx{{RAM_MB}}M"
    - "{{JVM_FLAGS...}}"
    - "-jar"
    - "server.jar"
    - "nogui"
stop:
  command: stop
  timeoutSec: 90
readyRegex: 'Done \(\d+[.,]\d+s\)!'

ports:
  - { name: game, port: "{{PORT}}", protocol: tcp }

warnCommand: "say {{message}}"
query: { kind: minecraft-ping, port: "{{PORT}}" }

console:
  commands:
    - { name: list, help: { pl: Pokaż graczy online, en: Show online players } }
    - { name: say, args: "<message...>", help: { pl: Wiadomość do wszystkich graczy, en: Message to all players } }
    - { name: tell, args: "<player> <message...>", help: { pl: Prywatna wiadomość, en: Private message } }
    - { name: gamemode, args: "<survival|creative|adventure|spectator> [player]", help: { pl: Zmień tryb gry, en: Change game mode } }
    - { name: difficulty, args: "<peaceful|easy|normal|hard>", help: { pl: Poziom trudności, en: Difficulty } }
    - { name: time, args: "<set|add> <day|night|noon|midnight|number>", help: { pl: Pora dnia, en: Time of day } }
    - { name: weather, args: "<clear|rain|thunder> [seconds]", help: { pl: Pogoda, en: Weather } }
    - { name: tp, args: "<player> <target-player|x y z>", help: { pl: Teleportuj gracza, en: Teleport a player } }
    - { name: give, args: "<player> <item> [count]", help: { pl: Daj przedmiot, en: Give an item } }
    - { name: clear, args: "[player] [item]", help: { pl: Wyczyść ekwipunek, en: Clear inventory } }
    - { name: kill, args: "[player]", help: { pl: Zabij gracza, en: Kill a player } }
    - { name: xp, args: "<add|set> <player> <amount> [points|levels]", help: { pl: Doświadczenie, en: Experience } }
    - { name: effect, args: "<give|clear> <player> [effect] [seconds] [amplifier]", help: { pl: Efekty mikstur, en: Potion effects } }
    - { name: enchant, args: "<player> <enchantment> [level]", help: { pl: Zaklęcie na trzymany przedmiot, en: Enchant the held item } }
    - { name: op, args: "<player>", help: { pl: Nadaj uprawnienia operatora, en: Grant operator rights } }
    - { name: deop, args: "<player>", help: { pl: Odbierz uprawnienia operatora, en: Revoke operator rights } }
    - { name: kick, args: "<player> [reason...]", help: { pl: Wyrzuć gracza, en: Kick a player } }
    - { name: ban, args: "<player> [reason...]", help: { pl: Zbanuj gracza, en: Ban a player } }
    - { name: ban-ip, args: "<player|ip> [reason...]", help: { pl: Zbanuj adres IP, en: Ban an IP address } }
    - { name: pardon, args: "<player>", help: { pl: Odbanuj gracza, en: Unban a player } }
    - { name: pardon-ip, args: "<ip>", help: { pl: Odbanuj adres IP, en: Unban an IP address } }
    - { name: banlist, args: "[players|ips]", help: { pl: Lista banów, en: Ban list } }
    - { name: whitelist, args: "<on|off|list|add|remove|reload> [player]", help: { pl: Biała lista, en: Whitelist } }
    - { name: gamerule, args: "<rule> [value]", help: { pl: Zasady świata (np. keepInventory true), en: World rules (e.g. keepInventory true) } }
    - { name: setworldspawn, args: "[x y z]", help: { pl: Punkt odrodzenia świata, en: World spawn point } }
    - { name: spawnpoint, args: "[player] [x y z]", help: { pl: Punkt odrodzenia gracza, en: Player spawn point } }
    - { name: summon, args: "<entity> [x y z]", help: { pl: Przywołaj moba, en: Summon a mob } }
    - { name: seed, help: { pl: Pokaż seed świata, en: Show the world seed } }
    - { name: save-all, help: { pl: Zapisz świat, en: Save the world } }
    - { name: save-off, help: { pl: Wyłącz automatyczny zapis (np. przed backupem), en: Disable autosave (e.g. before a backup) } }
    - { name: save-on, help: { pl: Włącz automatyczny zapis, en: Enable autosave } }
    - { name: plugins, help: { pl: Lista pluginów, en: List plugins } }
    - { name: tps, help: { pl: Wydajność serwera (TPS), en: Server performance (TPS) } }
    - { name: version, help: { pl: Wersja serwera, en: Server version } }
    - { name: stop, help: { pl: Zatrzymaj serwer (zapisuje świat), en: Stop the server (saves the world) } }
