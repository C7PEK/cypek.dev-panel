id: discord-node
name: Discord bot (Node.js)
category: discord-bot
icon: discord
description:
  pl: Bot w JavaScript/TypeScript (np. discord.js) z Twoich plików. Po utworzeniu wrzuć pliki bota w zakładce Pliki (upload, SFTP albo „Pobierz z linku” z ZIP-a). Zależności z package.json instalują się same przy starcie.
  en: A JavaScript/TypeScript bot (e.g. discord.js) from your own files. After creating it, put the bot's files in the Files tab (upload, SFTP or "Download from link" with a ZIP). Dependencies from package.json are installed automatically on start.

variables:
  - key: START_FILE
    label: { pl: Plik startowy, en: Entry file }
    help:
      pl: Zostaw puste, a panel sam wykryje start (skrypt "start" z package.json, potem index.js, bot.js, main.js, src/index.js, dist/index.js). Albo wpisz plik, np. src/bot.js.
      en: Leave empty to detect it (the "start" script from package.json, then index.js, bot.js, main.js, src/index.js, dist/index.js). Or enter a file, e.g. src/bot.js.
    type: string
    default: ""
    maxLength: 200
    pattern: '^$|^[^\s/][^\s]*\.(js|mjs|cjs)$'
  - key: NODE_VERSION
    label: { pl: Wersja Node.js, en: Node.js version }
    type: select
    options: ["26", "24", "22"]
    default: "26"
  - key: DISCORD_TOKEN
    label: { pl: Token bota Discord (opcjonalnie), en: Discord bot token (optional) }
    help:
      pl: Tylko jeśli Twój bot czyta go z process.env.DISCORD_TOKEN. Jeśli token jest w pliku .env albo config, zostaw puste.
      en: Only if your bot reads it from process.env.DISCORD_TOKEN. If the token is in a .env or config file, leave this empty.
    type: secret
    maxLength: 200

runtime:
  kind: node
  version: auto

# Nothing to download: the files come from the user.
install: []

start:
  # Values arrive as environment variables ({{X}} becomes "${X}"); nothing
  # from the user is pasted into this script.
  shell: |
    [ -z {{DISCORD_TOKEN}} ] && unset DISCORD_TOKEN
    if [ -f package.json ]; then
      if [ ! -d node_modules ] || [ package.json -nt node_modules/.panel-installed ] || { [ -f package-lock.json ] && [ package-lock.json -nt node_modules/.panel-installed ]; }; then
        echo "[panel] Installing dependencies (npm)..."
        if [ -f package-lock.json ]; then npm ci --no-fund --no-audit || exit 1; else npm install --no-fund --no-audit || exit 1; fi
        touch node_modules/.panel-installed
      fi
    fi
    if [ -z {{START_FILE}} ]; then
      if [ -f package.json ] && grep -q '"start"[[:space:]]*:' package.json; then exec npm start; fi
      for f in index.js bot.js main.js src/index.js src/bot.js dist/index.js; do
        [ -f "$f" ] && exec node "$f"
      done
      echo "[panel] No bot files found yet. Upload them in the Files tab (or set the entry file in Settings)."
      exit 78
    fi
    if [ ! -f {{START_FILE}} ]; then
      echo "[panel] "{{START_FILE}}" not found. Upload your bot files in the Files tab or change the entry file in Settings."
      exit 78
    fi
    exec node {{START_FILE}}
  env:
    NODE_ENV: production
stop:
  timeoutSec: 20
